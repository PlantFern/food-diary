spring:
  application:
    name: fooddiary

  modulith:
    runtime:
      flyway-enabled: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      file-size-threshold: 1MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      jakarta.persistence.validation.mode: callback

  thymeleaf:
    check-template-location: false

  flyway:
    enabled: true
    locations: >
      classpath:db/migration/common,
      classpath:db/migration/users,
      classpath:db/migration/food,
      classpath:db/migration/diaryProfiles,
      classpath:db/migration/meals,
      classpath:db/migration/specialists
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    # Keep SQL literals and bound string parameters on the same collation as the schema.
    hikari:
      connection-init-sql: "SET NAMES utf8mb4 COLLATE utf8mb4_0900_ai_ci"
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

app:
  storage:
    location: ./uploads
    max-size: 5242880
    allow-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
