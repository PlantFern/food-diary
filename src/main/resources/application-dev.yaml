spring:
  flyway:
    # The development data migration V100 may already be applied when lower-version
    # schema migrations are added later. Allow those pending migrations in dev only.
    out-of-order: true
    locations: >
      classpath:db/migration/common,
      classpath:db/migration/users,
      classpath:db/migration/food,
      classpath:db/migration/diaryProfiles,
      classpath:db/migration/meals,
      classpath:db/migration/specialists,
      classpath:db/seed,
      classpath:db/devdata
